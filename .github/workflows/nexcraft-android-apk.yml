name: NEXCRAFT Android APK

on:
  push:
    branches: [mobile-game-studio]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexcraft-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: gradle :mobile:examples:android_compose:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXCRAFT-3D-Studio-APK
          path: mobile/examples/android_compose/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
