name: NEXCRAFT Android APK

on:
  push:
    branches: [mobile-game-studio]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexcraft-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3
        with:
          gradle-version: '8.7'

      # The Kotlin wrapper calls JNI; build/package the Rust compiler .so files first.
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Build Three-Live native Android libraries and AAR
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          THREE_LIVE_PREBUILT_JNI: "1"
        run: bash scripts/build_android_aar.sh

      - name: Verify JNI libraries are packaged
        run: |
          test -f mobile/android/src/main/jniLibs/arm64-v8a/libthree_live_compiler.so
          test -f mobile/android/src/main/jniLibs/armeabi-v7a/libthree_live_compiler.so
          test -f mobile/android/src/main/jniLibs/x86_64/libthree_live_compiler.so

      - name: Build signed installable debug APK
        run: gradle :mobile:examples:android_compose:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXCRAFT-3D-Studio-APK
          path: mobile/examples/android_compose/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
